[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmissionlines"
version = "0.1.0"
description = "Transmission line modeling migration foundation."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  # infrasys 2.0 (integer component ids, infrastore backend) is unreleased; pin main until it tags.
  "infrasys @ git+https://github.com/NatLabRockies/infrasys@9b0d1b616ef4a76a43fcd2d62b745616ac93a28b",
  "numpy>=2",
  "pydantic>=2",
  "pandas>=2",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "pymupdf>=1.26,<2",
  "matplotlib>=3.8",
  # PyPI 0.9.0 ignores the input unit on fields without a base; use the fixed commit until 1.0.
  "r2x-core @ git+https://github.com/NatLabRockies/r2x-core@d090584fb69d642a0f745bef3491a70c3780d261",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
    "sphinx>=7.4,<9",
    "sphinx-rtd-theme>=3,<4",
    "sphinxcontrib-mermaid>=2.1.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra --cov=transmissionlines --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["transmissionlines"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
src = ["src", "test"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D101", "D102", "D104", "D204", "E501", "E701", "E702", "F403", "I001", "B905"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["transmissionlines"]
warn_unused_ignores = true
warn_return_any = true
disable_error_code = ["prop-decorator", "no-any-return", "import-untyped"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "infrasys.*",
  "pint.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transmissionlines.units"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true
